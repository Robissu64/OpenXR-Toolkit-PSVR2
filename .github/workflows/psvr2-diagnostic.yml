name: OpenXR Toolkit PSVR2 build

on:
  workflow_dispatch:
  push:
    branches:
      - diag/psvr2-eye-actions
      - fix/opencomposite-eye-actions
      - feature/crop-resolution-to-fov-v1
      - feature/crop-resolution-to-fov-v2
      - release/psvr2-toolkit-rc1
      - release/v1.0
      - fix/native-openxr-app-owned-eye-extension
      - release/v1.1-rc
      - release/v1.1
      - diag/metro-graphics-neutral
      - diag/graphics-neutral-two-games
      - diag/graphics-path-bisect

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - name: Fetch Omnicept Git LFS files
        shell: pwsh
        run: |
          git lfs install
          git -C external/Omnicept-SDK lfs install --local
          git -C external/Omnicept-SDK lfs pull

          $lib = 'external/Omnicept-SDK/lib/Release/msvc2019_64/hp_omnicept.lib'

          Write-Host "=== Omnicept library after LFS pull ==="
          Get-Item $lib | Select-Object FullName, Length

          $head = Get-Content $lib -AsByteStream -TotalCount 8
          Write-Host ([System.Text.Encoding]::ASCII.GetString($head))
      - name: Inspect Omnicept library
        shell: pwsh
        run: |
          $lib = 'external/Omnicept-SDK/lib/Release/msvc2019_64/hp_omnicept.lib'

          Write-Host "=== Omnicept submodule commit ==="
          git -C external/Omnicept-SDK rev-parse HEAD

          Write-Host "=== Library info ==="
          Get-Item $lib | Select-Object FullName, Length

          Write-Host "=== SHA256 ==="
          Get-FileHash $lib -Algorithm SHA256

          Write-Host "=== First 32 bytes ==="
          $head = Get-Content $lib -AsByteStream -TotalCount 32
          Write-Host (($head | ForEach-Object { $_.ToString('X2') }) -join ' ')

          Write-Host "=== First 8 bytes as ASCII ==="
          Write-Host ([System.Text.Encoding]::ASCII.GetString($head[0..7]))
      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore OpenXR-Toolkit.sln
      - name: Build unsigned x64 layer
        shell: pwsh
        run: msbuild OpenXR-Toolkit.sln /t:XR_APILAYER_MBUCCHIA_toolkit /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v142
      - name: Stage installation files
        shell: pwsh
        run: |
          $out = 'bin/x64/Release'
          $isV11Rc = $env:GITHUB_REF_NAME -eq 'release/v1.1-rc'
          $isV11Final = $env:GITHUB_REF_NAME -eq 'release/v1.1'
          $isMetroGraphicsDiag = $env:GITHUB_REF_NAME -eq 'diag/metro-graphics-neutral'
          $isGraphicsNeutral2Games = $env:GITHUB_REF_NAME -eq 'diag/graphics-neutral-two-games'
          $isGraphicsBisect = $env:GITHUB_REF_NAME -eq 'diag/graphics-path-bisect'
          $release = if ($isGraphicsBisect) {
            'release-output/OpenXR-Toolkit-PSVR2-GraphicsBisect-x64'
          } elseif ($isGraphicsNeutral2Games) {
            'release-output/OpenXR-Toolkit-PSVR2-GraphicsNeutral2Games-x64'
          } elseif ($isMetroGraphicsDiag) {
            'release-output/OpenXR-Toolkit-PSVR2-MetroGraphicsDiag-x64'
          } elseif ($isV11Final) {
            'release-output/OpenXR-Toolkit-PSVR2-v1.1-x64'
          } elseif ($isV11Rc) {
            'release-output/OpenXR-Toolkit-PSVR2-v1.1-RC-x64'
          } else {
            'release-output/OpenXR-Toolkit-PSVR2-v1.0-x64'
          }
          New-Item -ItemType Directory -Path "$release/shaders" -Force | Out-Null

          $runtimeFiles = @(
            'XR_APILAYER_MBUCCHIA_toolkit.dll',
            'XR_APILAYER_MBUCCHIA_toolkit.json',
            'aSeeVRClient.dll', 'jsoncpp.dll', 'libzmq-mt-4_3_3.dll',
            'Install-Layer.ps1', 'Uninstall-Layer.ps1'
          )
          foreach ($file in $runtimeFiles) {
            $source = Join-Path $out $file
            if (-not (Test-Path -LiteralPath $source)) { throw "Required release file missing: $file" }
            Copy-Item -LiteralPath $source -Destination $release
          }

          $shaderFiles = @(
            'CAS.hlsl', 'FSR.hlsl', 'NIS.hlsl', 'VRS.hlsl', 'postprocess.hlsl',
            'ffx_a.h', 'ffx_cas.h', 'ffx_fsr1.h', 'NIS_Scaler.h'
          )
          foreach ($file in $shaderFiles) {
            $source = Join-Path "$out/shaders" $file
            if (-not (Test-Path -LiteralPath $source)) { throw "Required shader file missing: $file" }
            Copy-Item -LiteralPath $source -Destination "$release/shaders"
          }

          $readme = if ($isV11Final -or $isMetroGraphicsDiag -or $isGraphicsNeutral2Games -or $isGraphicsBisect) { 'docs/PSVR2_V11_README.md' } elseif ($isV11Rc) { 'docs/PSVR2_V11_RC_README.md' } else { 'docs/PSVR2_V1_README.md' }
          $notes = if ($isV11Final -or $isMetroGraphicsDiag -or $isGraphicsNeutral2Games -or $isGraphicsBisect) { 'docs/RELEASE_NOTES_v1.1.md' } elseif ($isV11Rc) { 'docs/RELEASE_NOTES_v1.1_RC.md' } else { 'docs/RELEASE_NOTES_v1.0.md' }
          Copy-Item -LiteralPath $readme -Destination "$release/README.md"
          Copy-Item -LiteralPath $notes -Destination "$release/RELEASE_NOTES.md"
          if ($isGraphicsBisect) {
            Copy-Item -LiteralPath 'docs/GRAPHICS_BISECT_TESTING.txt' -Destination "$release/GRAPHICS_BISECT_TESTING.txt"
          }
          Copy-Item -LiteralPath 'scripts/Install.bat' -Destination $release
          Copy-Item -LiteralPath 'scripts/Uninstall.bat' -Destination $release
          Copy-Item -LiteralPath 'LICENSE' -Destination $release
          git rev-parse HEAD | Set-Content "$release/BUILD_COMMIT.txt"
      - name: Package v1.1 installation ZIP
        if: github.ref_name == 'release/v1.1'
        shell: pwsh
        run: |
          Compress-Archive -Path 'release-output/OpenXR-Toolkit-PSVR2-v1.1-x64/*' -DestinationPath 'release-output/OpenXR-Toolkit-PSVR2-v1.1-x64.zip' -CompressionLevel Optimal
          Get-Item 'release-output/OpenXR-Toolkit-PSVR2-v1.1-x64.zip' | Select-Object Name, Length
          Get-FileHash 'release-output/OpenXR-Toolkit-PSVR2-v1.1-x64/XR_APILAYER_MBUCCHIA_toolkit.dll' -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'diag/graphics-path-bisect' && 'OpenXR-Toolkit-PSVR2-GraphicsBisect-x64' || github.ref_name == 'diag/graphics-neutral-two-games' && 'OpenXR-Toolkit-PSVR2-GraphicsNeutral2Games-x64' || github.ref_name == 'diag/metro-graphics-neutral' && 'OpenXR-Toolkit-PSVR2-MetroGraphicsDiag-x64' || github.ref_name == 'release/v1.1' && 'OpenXR-Toolkit-PSVR2-v1.1-x64' || github.ref_name == 'release/v1.1-rc' && 'OpenXR-Toolkit-PSVR2-v1.1-RC-x64' || github.ref_name == 'fix/native-openxr-app-owned-eye-extension' && 'OpenXR-Toolkit-PSVR2-HubrisEyeBindingFix-x64' || 'OpenXR-Toolkit-PSVR2-v1.0-x64' }}
          path: ${{ github.ref_name == 'release/v1.1' && 'release-output/OpenXR-Toolkit-PSVR2-v1.1-x64.zip' || 'release-output/OpenXR-Toolkit-PSVR2-*/' }}
          if-no-files-found: error
