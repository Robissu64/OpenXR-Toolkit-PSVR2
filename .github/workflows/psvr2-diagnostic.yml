name: OpenXR Toolkit PSVR2 build

on:
  workflow_dispatch:
  push:
    branches:
      - diag/psvr2-eye-actions
      - fix/opencomposite-eye-actions
      - feature/crop-resolution-to-fov-v1
      - feature/crop-resolution-to-fov-v2
      - release/psvr2-toolkit-rc1
      - release/v1.0
      - fix/native-openxr-app-owned-eye-extension

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - name: Fetch Omnicept Git LFS files
        shell: pwsh
        run: |
          git lfs install
          git -C external/Omnicept-SDK lfs install --local
          git -C external/Omnicept-SDK lfs pull

          $lib = 'external/Omnicept-SDK/lib/Release/msvc2019_64/hp_omnicept.lib'

          Write-Host "=== Omnicept library after LFS pull ==="
          Get-Item $lib | Select-Object FullName, Length

          $head = Get-Content $lib -AsByteStream -TotalCount 8
          Write-Host ([System.Text.Encoding]::ASCII.GetString($head))
      - name: Inspect Omnicept library
        shell: pwsh
        run: |
          $lib = 'external/Omnicept-SDK/lib/Release/msvc2019_64/hp_omnicept.lib'

          Write-Host "=== Omnicept submodule commit ==="
          git -C external/Omnicept-SDK rev-parse HEAD

          Write-Host "=== Library info ==="
          Get-Item $lib | Select-Object FullName, Length

          Write-Host "=== SHA256 ==="
          Get-FileHash $lib -Algorithm SHA256

          Write-Host "=== First 32 bytes ==="
          $head = Get-Content $lib -AsByteStream -TotalCount 32
          Write-Host (($head | ForEach-Object { $_.ToString('X2') }) -join ' ')

          Write-Host "=== First 8 bytes as ASCII ==="
          Write-Host ([System.Text.Encoding]::ASCII.GetString($head[0..7]))
      - name: Restore NuGet packages
        shell: pwsh
        run: nuget restore OpenXR-Toolkit.sln
      - name: Build unsigned x64 v1.0 layer
        shell: pwsh
        run: msbuild OpenXR-Toolkit.sln /t:XR_APILAYER_MBUCCHIA_toolkit /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v142
      - name: Stage v1.0 release files
        shell: pwsh
        run: |
          $out = 'bin/x64/Release'
          $release = 'release-output/OpenXR-Toolkit-PSVR2-v1.0-x64'
          New-Item -ItemType Directory -Path "$release/shaders" -Force | Out-Null

          $runtimeFiles = @(
            'XR_APILAYER_MBUCCHIA_toolkit.dll',
            'XR_APILAYER_MBUCCHIA_toolkit.json',
            'aSeeVRClient.dll', 'jsoncpp.dll', 'libzmq-mt-4_3_3.dll',
            'Install-Layer.ps1', 'Uninstall-Layer.ps1'
          )
          foreach ($file in $runtimeFiles) {
            $source = Join-Path $out $file
            if (-not (Test-Path -LiteralPath $source)) { throw "Required release file missing: $file" }
            Copy-Item -LiteralPath $source -Destination $release
          }

          $shaderFiles = @(
            'CAS.hlsl', 'FSR.hlsl', 'NIS.hlsl', 'VRS.hlsl', 'postprocess.hlsl',
            'ffx_a.h', 'ffx_cas.h', 'ffx_fsr1.h', 'NIS_Scaler.h'
          )
          foreach ($file in $shaderFiles) {
            $source = Join-Path "$out/shaders" $file
            if (-not (Test-Path -LiteralPath $source)) { throw "Required shader file missing: $file" }
            Copy-Item -LiteralPath $source -Destination "$release/shaders"
          }

          Copy-Item -LiteralPath 'docs/PSVR2_V1_README.md' -Destination "$release/README.md"
          Copy-Item -LiteralPath 'docs/RELEASE_NOTES_v1.0.md' -Destination "$release/RELEASE_NOTES.md"
          Copy-Item -LiteralPath 'scripts/Install.bat' -Destination $release
          Copy-Item -LiteralPath 'scripts/Uninstall.bat' -Destination $release
          Copy-Item -LiteralPath 'LICENSE' -Destination $release
          git rev-parse HEAD | Set-Content "$release/BUILD_COMMIT.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'fix/native-openxr-app-owned-eye-extension' && 'OpenXR-Toolkit-PSVR2-HubrisEyeFix-x64' || 'OpenXR-Toolkit-PSVR2-v1.0-x64' }}
          path: release-output/OpenXR-Toolkit-PSVR2-v1.0-x64/
          if-no-files-found: error
